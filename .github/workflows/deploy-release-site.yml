name: Deploy release site

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/RELEASE-WEBSITE.md'
      - '.github/workflows/deploy-release-site.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/RELEASE-WEBSITE.md'
      - '.github/workflows/deploy-release-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release site
        run: ./website/Test-ReleaseSite.ps1

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Azure deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if (-not $env:AZURE_STATIC_WEB_APPS_API_TOKEN) {
            throw 'Configure the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret before deploying.'
          }
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: website
          api_location: ''
          output_location: ''
